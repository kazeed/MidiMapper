name: Canary build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: canary-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Test
        run: dotnet test src/MidiMapper.slnx --configuration Release --nologo

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Collect coverage
        run: dotnet test src/MidiMapper.slnx --configuration Release --collect:"XPlat Code Coverage" --results-directory coverage --nologo

      - name: Store coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/**/coverage.cobertura.xml
          if-no-files-found: error

  coverage-upload:
    name: Upload main coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: coverage
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage/**/coverage.cobertura.xml
          fail_ci_if_error: true
          use_oidc: true

  publish-windows:
    name: Publish Windows canary
    runs-on: windows-latest
    timeout-minutes: 15
    needs: test

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Publish single-file executable
        run: dotnet publish src/MidiMapper/MidiMapper.csproj --configuration Release --runtime win-x64 --nologo

      - name: Create zip archive
        shell: pwsh
        run: Compress-Archive -Path src/MidiMapper/bin/Release/net10.0/win-x64/publish/MidiMapper.exe -DestinationPath MidiMapper-win-x64-canary.zip

      - name: Upload canary artifact
        uses: actions/upload-artifact@v7
        with:
          name: MidiMapper-win-x64-canary-${{ github.sha }}
          path: MidiMapper-win-x64-canary.zip
          if-no-files-found: error

  publish-unix:
    name: Publish Linux canary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Publish single-file executable
        run: dotnet publish src/MidiMapper/MidiMapper.csproj --configuration Release --runtime linux-x64 --nologo

      - name: Make executable runnable
        run: chmod +x src/MidiMapper/bin/Release/net10.0/linux-x64/publish/MidiMapper

      - name: Create zip archive
        run: zip -j MidiMapper-linux-x64-canary.zip src/MidiMapper/bin/Release/net10.0/linux-x64/publish/MidiMapper

      - name: Upload canary artifact
        uses: actions/upload-artifact@v7
        with:
          name: MidiMapper-linux-x64-canary-${{ github.sha }}
          path: MidiMapper-linux-x64-canary.zip
          if-no-files-found: error
