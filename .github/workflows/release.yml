name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  publish-windows:
    name: Publish Windows release
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Publish executable
        run: dotnet publish src/MidiMapper/MidiMapper.csproj --configuration Release --runtime win-x64 --nologo

      - name: Create archive
        shell: pwsh
        run: Compress-Archive -Path src/MidiMapper/bin/Release/net10.0/win-x64/publish/MidiMapper.exe -DestinationPath MidiMapper-${{ github.ref_name }}-win-x64.zip

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: MidiMapper-${{ github.ref_name }}-win-x64
          path: MidiMapper-${{ github.ref_name }}-win-x64.zip
          if-no-files-found: error

  publish-linux:
    name: Publish Linux release
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Publish executable
        run: dotnet publish src/MidiMapper/MidiMapper.csproj --configuration Release --runtime linux-x64 --nologo

      - name: Create archive
        run: |
          chmod +x src/MidiMapper/bin/Release/net10.0/linux-x64/publish/MidiMapper
          zip MidiMapper-${{ github.ref_name }}-linux-x64.zip src/MidiMapper/bin/Release/net10.0/linux-x64/publish/MidiMapper

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: MidiMapper-${{ github.ref_name }}-linux-x64
          path: MidiMapper-${{ github.ref_name }}-linux-x64.zip
          if-no-files-found: error

  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [publish-windows, publish-linux]

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.zip > SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.zip dist/SHA256SUMS.txt --title "MidiMapper ${{ github.ref_name }}" --generate-notes
