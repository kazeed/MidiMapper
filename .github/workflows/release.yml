name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to release, without the leading v
        required: true
        type: string
        default: 1.0.0

permissions:
  contents: write

jobs:
  prepare:
    name: Create release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Create tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Run this workflow from the main branch." >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must have the form MAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          project_version=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' src/MidiMapper/MidiMapper.csproj | head -n 1)
          if [ "$project_version" != "$VERSION" ]; then
            echo "Project version $project_version does not match requested release $VERSION." >&2
            exit 1
          fi
          tag="v$VERSION"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/tmp/tag.json 2>/dev/null; then
            existing_sha=$(jq -r '.object.sha' /tmp/tag.json)
            if [ "$existing_sha" != "$GITHUB_SHA" ]; then
              echo "Tag $tag already points to $existing_sha, not $GITHUB_SHA." >&2
              exit 1
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$tag" \
              -f "sha=$GITHUB_SHA"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  publish-windows:
    name: Publish Windows release
    runs-on: windows-latest
    needs: prepare

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Publish executable
        run: dotnet publish src/MidiMapper/MidiMapper.csproj --configuration Release --runtime win-x64 --nologo

      - name: Smoke test executable
        shell: pwsh
        run: |
          $version = & src/MidiMapper/bin/Release/net10.0/win-x64/publish/MidiMapper.exe --version
          $expected = 'MidiMapper ${{ needs.prepare.outputs.version }}'
          if ($version.Trim() -ne $expected) { throw "Expected $expected but got $version" }

      - name: Create archive
        shell: pwsh
        run: Compress-Archive -Path src/MidiMapper/bin/Release/net10.0/win-x64/publish/MidiMapper.exe -DestinationPath MidiMapper-${{ needs.prepare.outputs.tag }}-win-x64.zip

      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          name: MidiMapper-${{ needs.prepare.outputs.tag }}-win-x64
          path: MidiMapper-${{ needs.prepare.outputs.tag }}-win-x64.zip
          if-no-files-found: error

  publish-linux:
    name: Publish Linux release
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Publish executable
        run: dotnet publish src/MidiMapper/MidiMapper.csproj --configuration Release --runtime linux-x64 --nologo

      - name: Smoke test executable
        run: |
          chmod +x src/MidiMapper/bin/Release/net10.0/linux-x64/publish/MidiMapper
          version=$(src/MidiMapper/bin/Release/net10.0/linux-x64/publish/MidiMapper --version)
          expected="MidiMapper ${{ needs.prepare.outputs.version }}"
          [ "$version" = "$expected" ] || { echo "Expected $expected but got $version"; exit 1; }

      - name: Create archive
        run: zip -j MidiMapper-${{ needs.prepare.outputs.tag }}-linux-x64.zip src/MidiMapper/bin/Release/net10.0/linux-x64/publish/MidiMapper

      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          name: MidiMapper-${{ needs.prepare.outputs.tag }}-linux-x64
          path: MidiMapper-${{ needs.prepare.outputs.tag }}-linux-x64.zip
          if-no-files-found: error

  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [prepare, publish-windows, publish-linux]

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.zip > SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view --repo "${{ github.repository }}" "${{ needs.prepare.outputs.tag }}" >/dev/null 2>&1; then
            gh release upload --repo "${{ github.repository }}" "${{ needs.prepare.outputs.tag }}" dist/*.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create --repo "${{ github.repository }}" "${{ needs.prepare.outputs.tag }}" dist/*.zip dist/SHA256SUMS.txt --title "MidiMapper ${{ needs.prepare.outputs.tag }}" --generate-notes
          fi
